name: Deploy Docs

on:
  push:
    tags: ['airs-docs-*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Forgejo release source tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          expected="airs-docs-${SOURCE_SHA}"
          test "$RELEASE_REF" = "$expected"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - name: Install SDK dependencies
        run: npm ci

      - name: Enforce @example coverage
        run: npm run docs:check

      - name: Generate API reference (TypeDoc)
        run: npm run docs:api

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs site
        working-directory: docs-site
        run: npm run build

      - name: Typecheck docs and runnable examples against the local SDK
        working-directory: docs-site
        run: npm run typecheck

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs-site/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
